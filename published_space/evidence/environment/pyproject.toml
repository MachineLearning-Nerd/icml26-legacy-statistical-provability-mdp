[project]
name = "agentic-theorem-prover-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2602.10538"
requires-python = "==3.12.*"
dependencies = [
  "jsonschema>=4.23,<5",
  "marimo>=0.15,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pytest>=8.4,<9",
  "z3-solver>=4.15,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
